# ===========================================================================
#  DASMOLabs 콘텐츠 관리(CMS) 설정 — Sveltia CMS
#  이 파일은 "어떤 내용을 어떤 양식으로 편집할지"를 정의합니다.
#  로그인한(저장소 쓰기권한이 있는) 사람만 /admin 에서 편집·저장할 수 있습니다.
#
#  ★ 저장하면 곧바로 실제 사이트(main 브랜치)에 반영됩니다(약 1분 소요).
#    실수로 잘못 저장했을 때 되돌리는 방법은 EDIT-LOGIN-GUIDE.md §復(복구) 참고.
# ===========================================================================

# (선택) VS Code 등에서 자동완성/검증을 받기 위한 줄
# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: dasmolabs/dasmolabs.github.io   # ★ 조직명/저장소명
  branch: main                 # GitHub Pages가 배포하는 브랜치 (항상 명시)
  # ── 아래 base_url은 "GitHub으로 로그인" 버튼용 (Cloudflare Worker OAuth) ──
  base_url: https://sveltia-cms-auth.gihyo123450.workers.dev

# 편집 화면 상단에 "사이트 보기" 링크를 띄워줍니다.
site_url: https://dasmolabs.github.io
display_url: https://dasmolabs.github.io

# 업로드한 이미지가 저장되는 위치(기본값). 구성원·소식 사진은 필드별로
# 하위 폴더(assets/uploads/members, assets/uploads/news)에 따로 저장됩니다.
media_folder: assets/uploads
public_folder: /assets/uploads

# 편집 화면 언어
locale: ko

# 오른쪽 "미리보기" 패널 끄기 — 이 사이트는 JSON을 사이트 스크립트가 그려주는
# 구조라 CMS 미리보기가 실제 화면과 달라 혼란만 줍니다. 실제 확인은
# 저장 후 1~2분 뒤 사이트 새로고침으로 하세요.
editor:
  preview: false

# ── 편집 화면 사용성 ──
#   • collapsed: auto → 기존 항목은 접힌 요약 한 줄로, 새 항목은 펼쳐서 표시
#   • summary → 접힌 줄에 보이는 라벨
#   • add_to_top: true → "추가" 버튼이 맨 위(최신이 맨 위 관례와 일치)
#   • minimize_collapsed: true → 목록 전체를 헤더 하나로 접음(위원회 111건)
#   • thumbnail → 접힌 줄에 사진 미리보기

collections:
  # ───────────────────────────── 사이트 기본정보 ─────────────────────────────
  - name: site
    label: ⚙️ 사이트 기본정보
    delete: false
    files:
      - name: general
        label: 기본 정보 · 소개 · 연구분야
        file: data/site.json
        fields:
          - { name: lab_abbr,    label: 약칭(헤더 대형 표기), widget: string, default: DASMOLabs }
          - { name: lab_name_ko, label: 연구실명(국문), widget: string }
          - { name: lab_name_en, label: 연구실명(영문), widget: string }
          - { name: tagline_en,  label: 태그라인(영문), widget: string, required: false }
          - { name: intro1, label: 소개 문단 1, widget: text }
          - { name: intro2, label: 소개 문단 2, widget: text, required: false }
          - name: about_photo
            label: 소개 사진(선택)
            widget: image
            required: false
            hint: 홈 '연구실 소개' 옆에 표시됩니다. 단체사진 등 가로 사진 권장(가로 1200px 이하, 500KB 이하).
          - name: research_topics
            label: 연구 분야 카드
            widget: list
            collapsed: auto
            summary: "{{fields.title}}"
            fields:
              - { name: icon,  label: 아이콘(이모지), widget: string, required: false, default: "▣" }
              - { name: title, label: 제목, widget: string }
              - { name: desc,  label: 설명, widget: text, required: false }
              - { name: tags,  label: 키워드 태그, widget: list, required: false }
          - name: classes_undergrad
            label: 학부 강의 과목
            widget: list
            collapsed: auto
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: 과목명, widget: string }
              - { name: link, label: "자료 링크(URL, 선택)", widget: string, required: false, hint: "강의계획서·자료 페이지가 있으면 주소를 넣으세요. 과목명이 링크로 바뀝니다." }
          - name: classes_grad
            label: 대학원 강의 과목
            widget: list
            collapsed: auto
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: 과목명, widget: string }
              - { name: link, label: "자료 링크(URL, 선택)", widget: string, required: false }
          - { name: address, label: 주소, widget: string }
          - { name: phone,   label: 전화번호, widget: string }
          - { name: email,   label: 대표 이메일, widget: string }
          - { name: office,  label: 연구실 위치, widget: string, required: false }
          - name: transit_info
            label: 오시는 길 — 대중교통 안내(선택)
            widget: text
            required: false
            hint: 홈 '오시는 길' 섹션에 표시됩니다. 예) 부산 도시철도 1호선 하단역 하차 후 셔틀버스 이용
          - { name: map_kakao,  label: 카카오맵 링크(선택), widget: string, required: false, hint: "카카오맵에서 위치 검색 후 '공유 > URL 복사'한 주소" }
          - { name: map_naver,  label: 네이버지도 링크(선택), widget: string, required: false }
          - { name: map_google, label: 구글지도 링크(선택), widget: string, required: false }

      - name: apply
        label: 지원 안내 (People → 지원 탭)
        file: data/apply.json
        fields:
          - name: intro
            label: 안내 문단
            widget: text
            hint: 지원 탭 맨 위에 표시되는 모집 안내문입니다.
          - name: items
            label: 지원 시 기재 항목
            widget: list
            collapsed: auto
            summary: "{{fields.label}}"
            hint: 지원 메일에 적어야 할 항목 목록입니다. 순서는 드래그로 바꿀 수 있습니다.
            fields:
              - { name: label, label: 항목명, widget: string }
              - { name: hint,  label: 설명 · 예시, widget: string, required: false }
          - name: faq
            label: 자주 묻는 질문(FAQ)
            widget: list
            required: false
            collapsed: auto
            summary: "{{fields.q}}"
            hint: 비워 두면 사이트에 FAQ 섹션이 표시되지 않습니다. 인건비·장학, 모집 시기, 연구실 생활 등을 적어 두면 문의가 줄어듭니다.
            fields:
              - { name: q, label: 질문, widget: string }
              - { name: a, label: 답변, widget: text }

  # ───────────────────────────── 소식 (News) ─────────────────────────────
  - name: news
    label: 📰 모집 공고 (소식)
    description: "News 페이지는 없어졌습니다(2026-07). 여기서 '모집' 분류로 쓴 글만 People → 지원 탭에 공고로 표시되고, 나머지 분류(학술대회·세미나·랩미팅 등)는 사이트에 나오지 않습니다."
    delete: false
    files:
      - name: news
        label: 모집 공고 · 소식 기록
        file: data/news.json
        fields:
          - name: news
            label: 소식 글
            widget: list
            collapsed: auto
            add_to_top: true
            summary: "{{fields.date}} · {{fields.category}} — {{fields.title}}"
            fields:
              - { name: date,     label: 날짜, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
              - name: category
                label: 분류
                widget: select
                default: 랩미팅
                options: [학술대회, 세미나, 랩미팅, 모집, 기타]
                hint: "'모집'만 사이트에 노출됩니다(People → 지원 탭 공고). 다른 분류는 기록용으로만 저장되고 화면에는 나오지 않습니다. 모집이 끝나면 아래 '모집 마감일'을 지정해 두거나 이 항목을 삭제하세요."
              - name: deadline
                label: 모집 마감일(선택 — 분류가 '모집'일 때만 사용)
                widget: datetime
                date_format: "YYYY-MM-DD"
                time_format: false
                picker_utc: false
                required: false
                hint: 이 날짜가 지나면 지원 탭의 모집 공고가 자동으로 내려갑니다. 비워 두면 항목을 삭제하기 전까지 계속 표시됩니다.
              - { name: title,    label: 제목, widget: string }
              - { name: body,     label: 내용 (일기처럼 자유롭게), widget: text, required: false, hint: "URL을 붙여넣으면 자동으로 클릭 가능한 링크가 됩니다. 줄바꿈도 그대로 표시됩니다." }
              - name: photos
                label: 사진 (여러 장 동시 선택 가능)
                widget: image
                multiple: true
                required: false
                media_folder: /assets/uploads/news
                public_folder: /assets/uploads/news
                hint: 가로 1600px 이하·1장당 500KB 이하로 줄여서 올리면 페이지가 빨라집니다. 파일명은 날짜-내용(예 20260425-seminar.jpg)으로 지으면 나중에 찾기 쉽습니다.
              - { name: link,     label: "관련 링크 (URL, 선택)", widget: string, required: false }

  - divider: true   # ── (위) 일반·소식 / (아래) 사람 ──

  # ───────────────────────────── 교수 소개 ─────────────────────────────
  - name: professor
    label: 👤 교수 소개
    delete: false
    files:
      - name: prof
        label: 교수 정보
        file: data/professor.json
        fields:
          - { name: name_ko, label: 이름(국문), widget: string }
          - { name: name_en, label: 이름(영문), widget: string }
          - { name: title,   label: 직위, widget: string }
          - { name: photo,   label: 사진, widget: image, required: false }
          - { name: fields,  label: 전공분야, widget: string, required: false }
          - { name: phone,   label: 연구실 전화, widget: string, required: false }
          - name: email
            label: 이메일
            widget: string
            required: false
            hint: 여러 개는 쉼표(,)로 구분하세요. 첫 번째 주소가 '지원하기' 메일의 수신 주소가 됩니다.
          - { name: office,  label: 연구실 위치, widget: string, required: false }
          - name: links
            label: 연구자 프로필 링크 (Google Scholar · ORCID 등)
            widget: list
            required: false
            collapsed: auto
            summary: "{{fields.label}}"
            hint: 예) 이름 "Google Scholar", 주소 "https://scholar.google.com/citations?user=..." — 교수 소개 연락처 아래에 버튼으로 표시됩니다.
            fields:
              - { name: label, label: 이름, widget: string }
              - { name: url,   label: 주소(URL), widget: string }
          - name: education
            label: 학력
            widget: list
            collapsed: auto
            summary: "{{fields.period}} · {{fields.place}}"
            fields:
              - { name: period, label: 기간, widget: string, hint: "예: 2002. 8. ~ 2010. 5." }
              - { name: place,  label: 기관 · 전공, widget: string }
              - { name: degree, label: 학위, widget: string, required: false }
              - { name: thesis, label: 학위논문, widget: text, required: false }
          - name: careers
            label: 주요 경력
            widget: list
            collapsed: auto
            summary: "{{fields.period}} · {{fields.what}}"
            fields:
              - { name: period, label: 기간, widget: string }
              - { name: what,   label: 내용, widget: string }
          - name: societies
            label: 학회활동
            widget: list
            collapsed: auto
            summary: "{{fields.name}} {{fields.position}}"
            fields:
              - { name: name,     label: 학회명, widget: string }
              - { name: position, label: 직위, widget: string, required: false }
              - { name: note,     label: 비고, widget: string, required: false }
          - name: media
            label: 언론활동
            widget: list
            collapsed: auto
            add_to_top: true
            summary: "{{fields.date}} · {{fields.source}} — {{fields.title}}"
            fields:
              - { name: date,   label: 일자, widget: string, required: false, hint: "예: 2025. 11. 30." }
              - { name: source, label: 매체 · 프로그램, widget: string, required: false, hint: "예: KNN 파워토크, 부산일보" }
              - { name: title,  label: 제목, widget: string }
              - { name: url,    label: 링크(URL), widget: string, required: false, hint: "해당 기사·방송의 주소를 정확히 붙여넣으세요." }
          - name: committees
            label: 대외 위원회 활동
            widget: list
            collapsed: auto
            minimize_collapsed: true
            add_to_top: true
            summary: "{{fields.period}} · {{fields.name}}"
            fields:
              - { name: period, label: 기간, widget: string, required: false, hint: "예: 2025. 7. 1. ~ 2027. 6. 30." }
              - { name: name,   label: 위원회명, widget: string }

  # ───────────────────────────── 구성원 ─────────────────────────────
  - name: members
    label: 👥 구성원 (Members)
    delete: false
    files:
      - name: members
        label: 구성원 목록
        file: data/members.json
        fields:
          - name: members
            label: 구성원
            widget: list
            collapsed: auto
            thumbnail: photo
            summary: "{{fields.name_ko}} · {{fields.level}} {{fields.grad_year}}"
            fields:
              - { name: name_ko, label: 이름(국문), widget: string }
              - { name: name_en, label: 이름(영문), widget: string, required: false }
              - name: group
                label: 구분
                widget: select
                default: current
                options:
                  - { label: 현재 구성원(재학), value: current }
                  - { label: 졸업생, value: alumni }
                hint: "졸업 처리: 구분을 '졸업생'으로 바꾸고 아래 졸업년도·학위명·논문명을 채우세요. 재학기간은 비워도 됩니다."
              - name: level
                label: 과정/학위
                widget: select
                options:
                  - { label: 박사과정 · 박사, value: PhD }
                  - { label: 석사과정 · 석사, value: Master }
                  - { label: 학부연구생, value: Undergraduate }
                  - { label: 학사 졸업, value: Bachelor }
                hint: "재학생은 박사과정/석사과정/학부연구생, 졸업생은 박사/석사/학사 졸업을 고르세요."
              - name: photo
                label: 사진
                widget: image
                required: false
                media_folder: /assets/uploads/members
                public_folder: /assets/uploads/members
                hint: 세로형 증명사진 권장, 가로 600px 이하·200KB 이하로 줄여서 올리세요. 파일명은 날짜-이름(예 20260301-hong.jpg) 권장.
              - name: email
                label: 이메일(선택)
                widget: string
                required: false
                hint: 재학생만 표시됩니다. 졸업생은 개인정보 보호를 위해 비워 두세요(입력해도 화면에 표시되지 않습니다).
              - { name: affiliation, label: 소속 · 현재 직장, widget: string, required: false }
              - { name: period, label: 재학기간 (재학생용), widget: string, required: false, hint: "예: 2024. 3. ~ 현재" }
              - { name: grad_year, label: 졸업년도 (졸업생용), widget: string, required: false, hint: "예: 2026. 2." }
              - { name: degree, label: 학위명 (졸업생용), widget: string, required: false, hint: "예: 공학박사 / 공학석사 / 공학사" }
              - { name: thesis, label: 학위논문명 (졸업생용), widget: text, required: false, hint: "'국문 제목 / English Title' 형식으로 쓰면 양쪽 모두 표시됩니다." }
              - name: interests
                label: 관심 연구분야 태그(선택)
                widget: list
                required: false
                hint: 예) ITS, 신호최적화, 자율주행 — 재학생 카드에 작은 태그로 표시됩니다.

  - divider: true   # ── (위) 사람 / (아래) 연구성과 ──

  # ───────────────────────────── 프로젝트 ─────────────────────────────
  - name: projects
    label: 📁 프로젝트 (Projects)
    delete: false
    files:
      - name: projects
        label: 연구 프로젝트 목록
        file: data/projects.json
        fields:
          - name: projects
            label: 프로젝트
            widget: list
            collapsed: auto
            add_to_top: true
            summary: "{{fields.period}} — {{fields.title}}"
            fields:
              - { name: period, label: 연구기간, widget: string, hint: "예: 2025. 9. ~ 2028. 8." }
              - { name: title,  label: 과제명, widget: text }
              - { name: org,    label: 지원기관, widget: string, required: false }

  # ───────────────────────────── 논문 ─────────────────────────────
  - name: publications
    label: 📄 논문 (Publications)
    delete: false
    files:
      - name: publications
        label: 논문 목록
        file: data/publications.json
        fields:
          - name: publications
            label: 논문
            widget: list
            collapsed: auto
            add_to_top: true
            summary: "{{fields.category}} · {{fields.citation}}"
            fields:
              - name: category
                label: 구분
                widget: select
                default: International
                options:
                  - { label: 국제 (International), value: International }
                  - { label: 국내 (Domestic), value: Domestic }
                  - { label: 기타 (Other), value: Other }
                  - { label: 저서 (Books), value: Books }
              - { name: citation, label: 서지정보(전체 문장), widget: text, hint: "저자. (연도). 제목, 저널, 권(호), 페이지. — 연도는 반드시 괄호로 (2025) 처럼 쓰세요. 연도 필터가 이 괄호를 읽습니다." }
              - { name: citation_en, label: 서지정보(영문, 선택), widget: text, required: false, hint: "국내 논문처럼 서지정보가 한글일 때만 채우세요. 영문 사이트에 이 문장이 대신 표시됩니다. 여기서도 연도는 반드시 (2025) 괄호 표기를 유지하세요." }
              - { name: sci,  label: SCI급 표시, widget: boolean, default: false, required: false }
              - { name: link, label: "원문 링크(URL, 선택)", widget: string, required: false, hint: "DOI 주소 권장 — 예: https://doi.org/10.3390/app15147669 — 입력하면 목록에 [link] 버튼이 생깁니다." }
              - { name: venue, label: "게재지 별도 표기(선택)", widget: string, required: false, hint: "서지정보에 이미 저널명이 있으면 비워 두세요." }

  # ───────────────────────────── 학술대회 ─────────────────────────────
  - name: conferences
    label: 🎤 학술대회 (Conferences)
    delete: false
    files:
      - name: conferences
        label: 학술대회 발표 목록
        file: data/conferences.json
        fields:
          - name: conferences
            label: 발표
            widget: list
            collapsed: auto
            add_to_top: true
            summary: "{{fields.date}} · {{fields.category}} — {{fields.title}}"
            fields:
              - name: category
                label: 구분
                widget: select
                default: Domestic
                options:
                  - { label: 국제 (International), value: International }
                  - { label: 국내 (Domestic), value: Domestic }
              - { name: title, label: 제목, widget: text, hint: "국내 발표는 '한글 제목 / English Title' 형식으로 쓰세요. 영문 사이트에는 슬래시(/) 뒤의 영문만 표시됩니다." }
              - { name: conference, label: 학술대회명, widget: string }
              - { name: conference_en, label: 학술대회명(영문, 선택), widget: string, required: false, hint: "학술대회명이 한글일 때만 채우세요. 영문 사이트에 이 이름이 대신 표시됩니다. 같은 학회는 늘 같은 영문 표기를 쓰세요." }
              - { name: date, label: 일자, widget: string, required: false, hint: "예: 2025. 10. 31." }

  # ───────────────────────────── 특허 ─────────────────────────────
  - name: patents
    label: 🔖 특허 (Patents)
    delete: false
    files:
      - name: patents
        label: 지식재산권 목록
        file: data/patents.json
        fields:
          - name: patents
            label: 항목
            widget: list
            collapsed: auto
            add_to_top: true
            summary: "{{fields.category}} · {{fields.name}}"
            fields:
              - name: category
                label: 구분
                widget: select
                default: Application
                options:
                  - { label: 출원 (Application), value: Application }
                  - { label: 등록 (Registration), value: Registration }
                  - { label: 프로그램·저작권 (Software), value: Software }
              - { name: name, label: 지식재산권명, widget: text }
              - { name: name_en, label: 영문 명칭(선택), widget: text, required: false, hint: 입력하면 영문 사이트에서 이 이름으로 표시됩니다. 비우면 원문 그대로 표시됩니다. }
              - name: scope
                label: 국내/국외
                widget: select
                required: false
                default: 국내
                options: [국내, 국외]
              - name: type
                label: 종류
                widget: select
                required: false
                default: 특허
                options: [특허, 특허(소프트웨어), 저작권등록(소프트웨어)]
              - { name: date,      label: 일자, widget: string, required: false, hint: "예: 2024. 1. 8." }
              - { name: number,    label: 출원/등록번호, widget: string, required: false }
              - { name: inventors, label: 발명인, widget: string, required: false }
              - { name: inventors_en, label: 발명인(영문, 선택), widget: string, required: false, hint: "영문 사이트에 표시됩니다. 사람 구분은 세미콜론(;)으로 — 예: Kim, Hoe Kyoung; Jung, Jihyo" }

  # ───────────────────────────── 수상 ─────────────────────────────
  - name: awards
    label: 🏆 수상 (Awards)
    delete: false
    files:
      - name: awards
        label: 수상 목록
        file: data/awards.json
        fields:
          - name: awards
            label: 수상
            widget: list
            collapsed: auto
            add_to_top: true
            summary: "{{fields.date}} — {{fields.title_ko}}"
            fields:
              - { name: date,     label: 일자, widget: string, hint: "예: 2025. 11." }
              - { name: title_ko, label: 제목(국문), widget: text }
              - { name: title_en, label: 제목(영문), widget: text, required: false, hint: 영문 사이트에 표시됩니다. 비우면 국문 제목이 표시됩니다. }
              - { name: venue,    label: 시상 · 학술대회, widget: string, required: false }
              - { name: venue_en, label: 시상 · 학술대회(영문, 선택), widget: string, required: false, hint: "영문 사이트에 표시됩니다. 상 이름(우수논문상 → Best Paper Award)까지 함께 적어야 무슨 상인지 전달됩니다." }

  - divider: true   # ── (위) 국문 콘텐츠 / (아래) 영문(English) 사이트 콘텐츠 ──

  # ═════════════════════════ 🌐 영문(/en/) 사이트 콘텐츠 ═════════════════════════
  #  영문 페이지는 아래 영문 파일을 먼저 읽습니다.
  #  논문·학술대회·특허·수상은 영문 파일이 따로 없고 국문 데이터를 함께 씁니다 —
  #  대신 항목마다 있는 영문 칸(서지정보(영문) · 학술대회명(영문) · 영문 명칭 ·
  #  발명인(영문) · 제목(영문) · 시상(영문))을 채우면 영문 사이트가 그 값을 씁니다.
  #  ★ 국문 쪽을 수정했다면, 같은 내용을 여기 영문 쪽에도 반영해 주세요.
  - name: site_en
    label: 🌐 [영문] 사이트 기본정보
    delete: false
    files:
      - name: general_en
        label: "[영문] 기본 정보 · 소개 · 연구분야"
        file: data/en/site.json
        fields:
          - { name: lab_abbr,    label: 약칭, widget: string, default: DASMOLabs }
          - { name: lab_name_ko, label: 연구실명(국문), widget: string }
          - { name: lab_name_en, label: 연구실명(영문), widget: string }
          - { name: tagline_en,  label: 태그라인, widget: string, required: false }
          - { name: intro1, label: 소개 문단 1 (영문), widget: text }
          - { name: intro2, label: 소개 문단 2 (영문), widget: text, required: false }
          - { name: about_photo, label: 소개 사진(선택), widget: image, required: false, hint: 보통 국문과 같은 사진을 지정합니다. }
          - name: research_topics
            label: 연구 분야 카드 (영문)
            widget: list
            collapsed: auto
            summary: "{{fields.title}}"
            fields:
              - { name: icon,  label: 아이콘(이모지), widget: string, required: false, default: "▣" }
              - { name: title, label: 제목(영문), widget: string }
              - { name: desc,  label: 설명(영문), widget: text, required: false }
              - { name: tags,  label: 키워드 태그(영문), widget: list, required: false }
          - name: classes_undergrad
            label: 학부 강의 과목 (영문)
            widget: list
            collapsed: auto
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: 과목명(영문), widget: string }
              - { name: link, label: "자료 링크(URL, 선택)", widget: string, required: false }
          - name: classes_grad
            label: 대학원 강의 과목 (영문)
            widget: list
            collapsed: auto
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: 과목명(영문), widget: string }
              - { name: link, label: "자료 링크(URL, 선택)", widget: string, required: false }
          - { name: address, label: 주소(영문), widget: string }
          - { name: phone,   label: 전화번호, widget: string }
          - { name: email,   label: 대표 이메일, widget: string }
          - { name: office,  label: 연구실 위치(영문), widget: string, required: false }
          - { name: transit_info, label: 오시는 길 — 대중교통 안내(영문, 선택), widget: text, required: false }
          - { name: map_kakao,  label: 카카오맵 링크(선택), widget: string, required: false }
          - { name: map_naver,  label: 네이버지도 링크(선택), widget: string, required: false }
          - { name: map_google, label: 구글지도 링크(선택), widget: string, required: false }

      - name: apply_en
        label: "[영문] 지원 안내"
        file: data/en/apply.json
        fields:
          - { name: intro, label: 안내 문단(영문), widget: text }
          - name: items
            label: 지원 시 기재 항목 (영문)
            widget: list
            collapsed: auto
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: 항목명(영문), widget: string }
              - { name: hint,  label: 설명 · 예시(영문), widget: string, required: false }
          - name: faq
            label: FAQ (영문)
            widget: list
            required: false
            collapsed: auto
            summary: "{{fields.q}}"
            fields:
              - { name: q, label: 질문(영문), widget: string }
              - { name: a, label: 답변(영문), widget: text }

  - name: news_en
    label: 🌐 [영문] 모집 공고 (소식)
    description: "영문 사이트도 News 페이지가 없어졌습니다(2026-07). 'Recruiting' 분류로 쓴 글만 People → Join Us 탭에 표시됩니다."
