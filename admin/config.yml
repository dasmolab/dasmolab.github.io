            summary: "{{fields.period}} · {{fields.what}}"
            fields:
              - { name: period, label: 기간(영문), widget: string }
              - { name: what,   label: 내용(영문), widget: string }
          - name: societies
            label: 학회활동 (영문)
            widget: list
            collapsed: auto
            summary: "{{fields.name}} {{fields.position}}"
            fields:
